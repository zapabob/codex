# ==================== サブエージェント ====================
[subagents]
enabled = true
inherit_model = true
max_parallel = 4
token_budget = 40000
# 🆕 MCP 経由で Codex ツールを使用
use_codex_mcp = true

# ==================== Deep Research設定 ====================
[deep_research]
# Web検索バックエンド（brave, google, duckduckgo, bing）
# ⚠️ 修正（2025-10-28）: braveは無効化されているためduckduckgoをデフォルトに変更
default_backend = "duckduckgo"
# フォールバックチェーン（有効なバックエンドのみ）
fallback_backends = ["google", "bing"]
# 最大検索結果数
max_results = 10
# タイムアウト（秒）
timeout_seconds = 30
# キャッシュ有効化
enable_cache = true

# ==================== フック機能 ====================
# タスク完了時の音声通知
# Agent/Plan完了時: marisa_owattaze.wav（終わったぜ！）
[hooks]
# タスク全体完了時（Plan実行完了時） → Marisa
on_task_complete = "powershell -ExecutionPolicy Bypass -File C:\\Users\\downl\\Desktop\\codex\\zapabob\\scripts\\play-completion-sound.ps1"
# サブエージェント完了時（Agent実行完了時） → Marisa
on_subagent_complete = "powershell -ExecutionPolicy Bypass -File C:\\Users\\downl\\Desktop\\codex\\zapabob\\scripts\\play-completion-sound.ps1"
# セッション終了時 → Marisa
on_session_end = "powershell -ExecutionPolicy Bypass -File C:\\Users\\downl\\Desktop\\codex\\zapabob\\scripts\\play-completion-sound.ps1"

# ==================== 監査ログ ====================
[audit]
enabled = true
format = "json"
include_mcp_calls = true
include_tool_args = true
log_dir = "~/.codex/audit-logs"

