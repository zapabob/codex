# ==================== 讖溯・繝輔Λ繧ｰ ====================
[features]
# Web讀懃ｴ｢讖溯・・医Δ繝・Ν邨・∩霎ｼ縺ｿ・・web_search = true
# MCP邨ｱ蜷・mcp_integration = true

# OpenAI Provider險ｭ螳壹ｒ荳頑嶌縺・# 繝・ヵ繧ｩ繝ｫ繝医・Responses API縺ｮ莉｣繧上ｊ縺ｫChat Completions API繧剃ｽｿ逕ｨ
[model_providers.openai]
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
name = "OpenAI (Chat Completions API)"
requires_openai_auth = true
wire_api = "chat"
