# Codex MCP Server - メインサーバー（コンフリクト回避、自然言語CLI、Webhook統合）
[mcp_servers.codex]
args = ["mcp-server"]
command = "codex"
env.GITHUB_TOKEN = "${GITHUB_TOKEN}"
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"
env.SLACK_WEBHOOK_URL = "${SLACK_WEBHOOK_URL}"
startup_timeout_sec = 60

# Codex Supervisor - マルチエージェント調整（高度なエラーハンドリング）
# ⚠️ 無効化: 'supervisor' subcommand not implemented (use 'delegate' instead)
[mcp_servers.codex-supervisor]
args = ["supervisor"]
command = "codex"
disabled = true
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"
startup_timeout_sec = 60

# Codex Research - ディープリサーチ（Webhook統合付き）
# 🔄 有効化済み（2025-10-28）: 'research' subcommand implemented
[mcp_servers.codex-research]
args = ["research"]
command = "codex"
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"
startup_timeout_sec = 60

# Codex Agent - 自然言語CLI（AgentInterpreter）
# 🔄 有効化済み（2025-10-28）: 'agent' subcommand implemented
[mcp_servers.codex-agent]
args = ["agent"]
command = "codex"
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"
startup_timeout_sec = 60

# Serena - AIオーケストレーション・コンテキスト管理（21ツール利用可能）
[mcp_servers.serena]
args = [
    "--from",
    "git+https://github.com/oraios/serena",
    "serena",
    "start-mcp-server",
    "--context",
    "codex",
]
command = "C:\\Users\\downl\\.local\\bin\\uvx.exe"
env.RUST_LOG = "info"
startup_timeout_sec = 90

