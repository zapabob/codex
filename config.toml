# Codex Configuration
# サブエージェント用の設定

# モデル設定
model = "gpt-5-codex"

# 🆕 MCP Client機能を有効化
experimental_use_rmcp_client = true

# 🔍 Web検索機能を有効化（モデル組み込み検索）
enable_web_search = true

# ==================== 機能フラグ ====================
[features]
# Web検索機能（モデル組み込み）
web_search = true
# MCP統合
mcp_integration = true

# OpenAI Provider設定を上書き
# デフォルトのResponses APIの代わりにChat Completions APIを使用
[model_providers.openai]
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
name = "OpenAI (Chat Completions API)"
requires_openai_auth = true
wire_api = "chat"
# 🔍 Web検索機能を有効化
enable_web_search = true
web_search_grounding = true

# ==================== セキュリティ ====================
[sandbox]
default_mode = "read-only"

[approval]
policy = "on-request"

# ==================== MCP サーバー ====================
# 🔄 CursorIDE統合済み設定 - v0.51.0-zapabob.1 (2025-10-28更新)
# 
# 📝 Cursor IDE統合:
#   - Codex CLI: このconfig.tomlを使用
#   - Cursor IDE: c:\Users\downl\.cursor\mcp.json を使用
#   - 🔄 両方の設定ファイルを完全同期（2025-10-28）
#
# ✅ テスト済み（2025-10-24）:
#   - 全5サーバー動作確認済み
#   - codex: 7ツール利用可能
#   - serena: 21ツール利用可能
#   - markitdown, arxiv, gemini: 動作確認済み
