# Codex Configuration
# サブエージェント用の設定

# モデル設定
model = "gpt-5-codex"

# OpenAI Provider設定を上書き
# デフォルトのResponses APIの代わりにChat Completions APIを使用
[model_providers.openai]
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
name = "OpenAI (Chat Completions API)"
requires_openai_auth = true
wire_api = "chat"

# ==================== セキュリティ ====================
[sandbox]
default_mode = "read-only"

[approval]
policy = "on-request"

# ==================== MCP サーバー ====================
# CursorIDE統合済み設定 - v0.48.0 ClaudeCode-surpassing features

# Codex MCP Server - メインサーバー（コンフリクト回避、自然言語CLI、Webhook統合）
[mcp_servers.codex]
args = ["mcp-server"]
command = "codex"
env.GITHUB_TOKEN = "${GITHUB_TOKEN}"
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"
env.SLACK_WEBHOOK_URL = "${SLACK_WEBHOOK_URL}"

# Codex Supervisor - マルチエージェント調整（高度なエラーハンドリング）
[mcp_servers.codex-supervisor]
args = ["supervisor"]
command = "codex"
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"

# Codex Research - ディープリサーチ（Webhook統合付き）
[mcp_servers.codex-research]
args = ["research"]
command = "codex"
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"

# Codex Agent - 自然言語CLI（AgentInterpreter）
[mcp_servers.codex-agent]
args = ["agent"]
command = "codex"
env.OPENAI_API_KEY = "${OPENAI_API_KEY}"
env.RUST_LOG = "info"

# Serena - AIオーケストレーション・コンテキスト管理
[mcp_servers.serena]
args = [
    "--from",
    "git+https://github.com/oraios/serena",
    "serena",
    "start-mcp-server",
    "--context",
    "codex",
]
command = "uvx"
env.RUST_LOG = "info"
startup_timeout_sec = 10

# Context7 - Upstash コンテキスト管理・ベクター検索
[mcp_servers.context7]
args = ["-y", "@upstash/context7-mcp"]
command = "npx"
env.RUST_LOG = "info"

# Playwright - Web自動化・テスト・スクレイピング
[mcp_servers.playwright]
args = ["@playwright/mcp@latest"]
command = "npx"
env.RUST_LOG = "info"

# Filesystem - ファイルシステム操作・管理
[mcp_servers.filesystem]
args = ["-y", "@modelcontextprotocol/server-filesystem"]
command = "npx"
env.RUST_LOG = "info"

# GitHub - GitHub API操作・PR/Issue管理
[mcp_servers.github]
args = ["-y", "@modelcontextprotocol/server-github"]
command = "npx"
env.GITHUB_TOKEN = "${GITHUB_TOKEN}"
env.RUST_LOG = "info"

# ==================== サブエージェント ====================
[subagents]
enabled = true
inherit_model = true
max_parallel = 4
token_budget = 40000
# 🆕 MCP 経由で Codex ツールを使用
use_codex_mcp = true

# ==================== フック機能 ====================
# タスク完了時の音声通知
# Codex: reimu_owattawa.wav / Cursor: marisa_owattaze.wav
[hooks]
# タスク全体完了時（Plan実行完了時） → Reimu
on_task_complete = "powershell -ExecutionPolicy Bypass -File zapabob/scripts/play-codex-sound.ps1"
# サブエージェント完了時（Agent実行完了時） → Reimu
on_subagent_complete = "powershell -ExecutionPolicy Bypass -File zapabob/scripts/play-codex-sound.ps1"
# セッション終了時 → Reimu
on_session_end = "powershell -ExecutionPolicy Bypass -File zapabob/scripts/play-codex-sound.ps1"

# ==================== 監査ログ ====================
[audit]
enabled = true
format = "json"
include_mcp_calls = true
include_tool_args = true
log_dir = "~/.codex/audit-logs"
