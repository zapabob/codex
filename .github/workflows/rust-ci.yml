name: rust-ci
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch:

# CI builds in debug (dev) for faster signal.

jobs:
  # --- Detect what changed to detect which tests to run (always runs) -------------------------------------
  changed:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ubuntu-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-registry-
      - name: Detect changed paths (no external action)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            # List files changed between base and PR head
            mapfile -t files < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          else
            # On push / manual runs, default to running everything
            files=("codex-rs/force" ".github/force")
          fi

          codex=false
          workflows=false
          for f in "${files[@]}"; do
            [[ $f == codex-rs/* ]] && codex=true
            [[ $f == .github/* ]] && workflows=true
          done

          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  # --- CI that doesn't need specific targets ---------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' || github.event_name == 'push' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Verify codegen for mcp-types
        run: py -3 ./mcp-types/check_lib_rs.py

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' || github.event_name == 'push' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: cargo-shear
      - name: cargo shear
        run: cargo shear

  # --- Fast incremental build and install job -----------------------------------
  fast_build_install:
    name: Fast Build & Install - Windows Latest (Avast Safe)
    runs-on: windows-latest
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || github.event_name == 'push' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (nightly for faster builds)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo incremental artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
            codex-rs/target/
          key: windows-fast-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            windows-fast-build-

      - name: Install sccache for faster compilation
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: sccache

      - name: Configure incremental build (Avast Safe)
        run: |
          echo "CARGO_INCREMENTAL=1" >> $env:GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          echo "SCCACHE_CACHE_SIZE=5G" >> $env:GITHUB_ENV
          echo "CARGO_BUILD_JOBS=8" >> $env:GITHUB_ENV
          echo "RUST_BACKTRACE=1" >> $env:GITHUB_ENV
          echo "RUSTFLAGS=-C target-cpu=native -C opt-level=2 -C link-args=/DEBUG:NONE" >> $env:GITHUB_ENV

      - name: Setup Windows Defender exclusions
        run: |
          $exclusions = @("$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$(pwd)", "C:\Program Files\Git")
          foreach ($path in $exclusions) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }

      - name: Save Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
            codex-rs/target/
          key: windows-fast-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Kill existing codex processes
        run: |
          $processes = Get-Process | Where-Object { $_.ProcessName -like "*codex*" }
          if ($processes) {
            $processes | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

      - name: Fast incremental build and install
        working-directory: codex-rs
        run: |
          # 高速差分ビルド実行
          cargo build --release -p codex-cli

          # プロセスキル後のバイナリ上書きインストール
          $bin_path = "target/release/codex.exe"
          if (Test-Path $bin_path) {
            Copy-Item $bin_path "$HOME/.cargo/bin/codex.exe" -Force
          } else {
            cargo install --path cli --force --root ~/.cargo
          }

      - name: Verify installation and cleanup
        run: |
          codex --version
          $remaining = Get-Process | Where-Object { $_.ProcessName -like "*codex*" -and $_.Id -ne $PID }
          if ($remaining) { $remaining | Stop-Process -Force -ErrorAction SilentlyContinue }

  # --- CI to validate on different os/targets --------------------------------
  lint_build:
    name: Lint/Build - ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.profile == 'release' && ' (release)' || '' }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    timeout-minutes: 30
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' || github.event_name == 'push' }}
    defaults:
      run:
        working-directory: codex-rs
    env:
      USE_SCCACHE: "true"
      CARGO_INCREMENTAL: "1"
      SCCACHE_CACHE_SIZE: "10G"
      CARGO_BUILD_JOBS: "8"
      RUST_BACKTRACE: "1"
      RUSTFLAGS: ${{ startsWith(matrix.runner, 'windows') && '-C target-cpu=native -C opt-level=2 -C link-args=/DEBUG:NONE' || '-C target-cpu=native -C opt-level=2' }}
      CODEX_BWRAP_ENABLE_FFI: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            profile: dev
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: dev
            runs_on: { group: codex-runners, labels: codex-linux-x64 }
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            profile: dev
            runs_on: { group: codex-runners, labels: codex-linux-x64 }
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            profile: dev
            runs_on: { group: codex-runners, labels: codex-windows-x }
