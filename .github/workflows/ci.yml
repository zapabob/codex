name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # stage_npm_packages.py requires DotSlash when staging releases.
      - uses: facebook/install-dotslash@v2

      - name: Stage npm package
        id: stage_npm_package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use a rust-release version that includes all native binaries.
          CODEX_VERSION=0.74.0
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./scripts/stage_npm_packages.py \
            --release-version "$CODEX_VERSION" \
            --package codex \
            --output-dir "$OUTPUT_DIR"
          PACK_OUTPUT="${OUTPUT_DIR}/codex-npm-${CODEX_VERSION}.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload staged npm package artifact
        uses: actions/upload-artifact@v6
        with:
          name: codex-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md
      - name: Validate README bilingual format (English/Japanese)
        run: |
          # Check if README contains both English and Japanese sections
          if ! grep -q "## English" README.md || ! grep -q "## 日本語" README.md; then
            echo "README must contain both English and Japanese sections"
            exit 1
          fi
          # Check for bilingual consistency
          en_sections=$(grep -c "^## " README.md)
          jp_sections=$(grep -c "^## " README.md | grep -v "English\|日本語\|Features\|機能" | wc -l)
          if [ "$en_sections" -ne "$jp_sections" ]; then
            echo "English and Japanese sections must be balanced"
            exit 1
          fi

      - name: Ensure codex-cli/README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py codex-cli/README.md
      - name: Check codex-cli/README ToC
        run: python3 scripts/readme_toc.py codex-cli/README.md

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

  mcp-integration-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tqdm requests

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      # Build MCP programs
      - name: Build MCP programs
        shell: pwsh
        run: |
          Set-Location codex-rs
          cargo build --release -p codex-gemini-cli-mcp-server
          if (-not (cargo build --release -p codex-supervisor 2>&1)) {
            Write-Host "Warning: supervisor build failed, continuing..."
          }
          if (-not (cargo build --release -p codex-mcp-server 2>&1)) {
            Write-Host "Warning: mcp-server build failed, continuing..."
          }
          if (-not (cargo build --release -p codex-deep-research 2>&1)) {
            Write-Host "Warning: deep-research build failed, continuing..."
          }

      # Test MCP binaries
      - name: Test MCP binaries
        run: |
          cd codex-rs
          if (Test-Path "target\release\codex-gemini-cli-mcp-server.exe") {
            Write-Host "✅ codex-gemini-cli-mcp-server.exe found"
          } else {
            Write-Host "❌ codex-gemini-cli-mcp-server.exe missing"
            exit 1
          }

      # Run integration tests
      - name: Run integration tests
        run: |
          python test_continuous_integration.py
        continue-on-error: true

      # Build TUI
      - name: Build TUI
        run: |
          cd codex-rs
          cargo build --release -p codex-tui

      - name: Test TUI binary
        run: |
          cd codex-rs
          if (Test-Path "target\release\codex-tui.exe") {
            .\target\release\codex-tui.exe --help | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ TUI binary functional"
            } else {
              Write-Host "❌ TUI binary test failed"
              exit 1
            }
          } else {
            Write-Host "❌ TUI binary not found"
            exit 1
          }

  gui-tests:
    name: GUI Integration Tests
    runs-on: windows-2022
    timeout-minutes: 25
    needs: build-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: gui-tests
        run: npx playwright install --with-deps

      - name: Run GUI integration tests
        working-directory: gui-tests
        run: npm run test:headed -- --project=chromium-cursor
        env:
          CI: true
