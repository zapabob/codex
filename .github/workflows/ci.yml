name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # stage_npm_packages.py requires DotSlash when staging releases.
      - uses: facebook/install-dotslash@v2

      - name: Stage npm package
        id: stage_npm_package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODEX_VERSION=0.40.0
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./scripts/stage_npm_packages.py \
            --release-version "$CODEX_VERSION" \
            --package codex \
            --output-dir "$OUTPUT_DIR"
          PACK_OUTPUT="${OUTPUT_DIR}/codex-npm-${CODEX_VERSION}.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload staged npm package artifact
        uses: actions/upload-artifact@v5
        with:
          name: codex-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Ensure codex-cli/README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py codex-cli/README.md
      - name: Check codex-cli/README ToC
        run: python3 scripts/readme_toc.py codex-cli/README.md

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

  mcp-integration-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tqdm requests

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      # Build MCP programs
      - name: Build MCP programs
        run: |
          cd codex-rs
          cargo build --release -p codex-gemini-cli-mcp-server
          cargo build --release -p codex-supervisor || echo "supervisor build failed, continuing..."
          cargo build --release -p codex-mcp-server || echo "mcp-server build failed, continuing..."
          cargo build --release -p codex-deep-research || echo "deep-research build failed, continuing..."

      # Test MCP binaries
      - name: Test MCP binaries
        run: |
          cd codex-rs
          if (Test-Path "target\release\codex-gemini-cli-mcp-server.exe") {
            Write-Host "✅ codex-gemini-cli-mcp-server.exe found"
          } else {
            Write-Host "❌ codex-gemini-cli-mcp-server.exe missing"
            exit 1
          }

      # Run integration tests
      - name: Run integration tests
        run: |
          python test_continuous_integration.py
        continue-on-error: true

      # Build TUI
      - name: Build TUI
        run: |
          cd codex-rs
          cargo build --release -p codex-tui

      - name: Test TUI binary
        run: |
          cd codex-rs
          if (Test-Path "target\release\codex-tui.exe") {
            .\target\release\codex-tui.exe --help | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ TUI binary functional"
            } else {
              Write-Host "❌ TUI binary test failed"
              exit 1
            }
          } else {
            Write-Host "❌ TUI binary not found"
            exit 1
          }

  gui-tests:
    name: GUI Integration Tests
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: gui-tests
        run: npx playwright install --with-deps

      - name: Run GUI integration tests
        working-directory: gui-tests
        run: npm run test:headed -- --project=chromium-cursor
        env:
          CI: true
