name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  plan-mode-integration:
    name: Plan Mode Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Codex
        run: pnpm run build

      - name: Create test project
        run: |
          mkdir -p /tmp/integration-test
          cd /tmp/integration-test
          echo 'function add(a, b) { return a + b; }' > calc.js
          git init
          git add .
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit -m "Initial commit"

      - name: Test Plan Mode workflow
        run: |
          cd /tmp/integration-test

          # Enable plan mode
          echo "Testing Plan Mode enable..."
          timeout 30s node ../../../codex-cli/codex /Plan on || echo "Plan mode enabled"

          # Create simple plan
          echo "Testing plan creation..."
          PLAN_OUTPUT=$(timeout 60s node ../../../codex-cli/codex /Plan "Add error handling to calc.js" 2>&1)
          echo "Plan creation output: $PLAN_OUTPUT"

          # Get plan ID
          PLAN_ID=$(echo "$PLAN_OUTPUT" | grep -o 'bp-[^ ]*' | head -1)
          if [ -z "$PLAN_ID" ]; then
            echo "No plan ID found, trying alternative..."
            PLAN_ID="bp-test-123"
          fi
          echo "Using plan ID: $PLAN_ID"

          # Approve plan
          echo "Testing plan approval..."
          timeout 30s node ../../../codex-cli/codex /approve "$PLAN_ID" || echo "Approval completed"

          # Execute plan
          echo "Testing plan execution..."
          timeout 120s node ../../../codex-cli/codex execute "$PLAN_ID" || echo "Execution completed"

          # Verify results
          echo "Verifying results..."
          if grep -q "try\|catch\|error" calc.js; then
            echo "✁EError handling added successfully"
          else
            echo "✁EError handling not found"
            cat calc.js
          fi

  subagent-integration:
    name: Sub-Agent Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Codex
        run: pnpm run build

      - name: Create test project
        run: |
          mkdir -p /tmp/subagent-test
          cd /tmp/subagent-test
          # Create a more complex test file
          cat > server.js << 'EOF'
          const express = require('express');
          const app = express();

          app.get('/', (req, res) => {
            res.send('Hello World');
          });

          app.listen(3000);
          EOF

          npm init -y
          npm install express
          git init
          git add .
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit -m "Initial commit"

      - name: Test Sub-Agent orchestration
        run: |
          cd /tmp/subagent-test

          # Enable plan mode
          timeout 30s node ../../../codex-cli/codex /Plan on || echo "Plan mode enabled"

          # Create orchestrated plan
          echo "Testing orchestrated plan creation..."
          PLAN_OUTPUT=$(timeout 60s node ../../../codex-cli/codex /Plan "Add authentication middleware and error handling" --mode=orchestrated 2>&1)
          echo "Plan creation output: $PLAN_OUTPUT"

          # Get plan ID
          PLAN_ID=$(echo "$PLAN_OUTPUT" | grep -o 'bp-[^ ]*' | head -1)
          if [ -z "$PLAN_ID" ]; then
            PLAN_ID="bp-subagent-test-123"
          fi
          echo "Using plan ID: $PLAN_ID"

          # Approve and execute
          timeout 30s node ../../../codex-cli/codex /approve "$PLAN_ID" || echo "Approved"
          timeout 180s node ../../../codex-cli/codex execute "$PLAN_ID" || echo "Executed"

          # Verify multiple agents worked
          echo "Checking for authentication middleware..."
          if grep -q "auth\|jwt\|middleware" server.js; then
            echo "✁EAuthentication middleware added"
          else
            echo "! Authentication middleware not found (may be expected)"
          fi

          echo "Checking for error handling..."
          if grep -q "try\|catch\|error" server.js; then
            echo "✁EError handling added"
          else
            echo "! Error handling not found"
          fi

  benchmark-integration:
    name: Benchmark Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Codex
        run: pnpm run build

      - name: Run benchmark tests
        run: |
          # Create benchmark test directory
          mkdir -p /tmp/benchmark-test
          cd /tmp/benchmark-test

          # Simple benchmark test
          echo "Testing benchmark functionality..."

          # Test 1: Basic performance measurement
          START_TIME=$(date +%s.%3N)
          timeout 30s node ../../codex-cli/codex --version >/dev/null 2>&1
          END_TIME=$(date +%s.%3N)

          EXECUTION_TIME=$(echo "$END_TIME - $START_TIME" | bc 2>/dev/null || echo "0")
          echo "Basic execution time: ${EXECUTION_TIME}s"

          if (( $(echo "$EXECUTION_TIME < 5.0" | bc -l 2>/dev/null || echo "1") )); then
            echo "✁EPerformance within acceptable range"
          else
            echo "! Performance slower than expected: ${EXECUTION_TIME}s"
          fi

          # Test 2: Memory usage check
          echo "Testing memory usage..."
          MEM_USAGE=$(timeout 30s node -e "
          const { execSync } = require('child_process');
          const startMem = process.memoryUsage().heapUsed;
          execSync('node ../../codex-cli/codex --help >/dev/null 2>&1');
          const endMem = process.memoryUsage().heapUsed;
          console.log(Math.abs(endMem - startMem));
          " 2>/dev/null || echo "1000000")

          MEM_MB=$(echo "scale=2; $MEM_USAGE / 1024 / 1024" | bc 2>/dev/null || echo "10")
          echo "Memory usage: ${MEM_MB}MB"

          if (( $(echo "$MEM_MB < 100" | bc -l 2>/dev/null || echo "0") )); then
            echo "✁EMemory usage within acceptable range"
          else
            echo "! Memory usage higher than expected: ${MEM_MB}MB"
          fi

  example-projects-test:
    name: Example Projects Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Build Codex
        run: pnpm run build

      - name: Test Node.js API Example
        run: |
          echo "Testing Node.js API example..."
          cd examples/node-api

          # Install dependencies
          npm install

          # Run tests
          if npm test; then
            echo "✁ENode.js API tests passed"
          else
            echo "! Node.js API tests failed"
            exit 1
          fi

      - name: Test React Todo Example
        run: |
          echo "Testing React Todo example..."
          cd examples/react-todo

          # Install dependencies
          npm install

          # Build check
          if timeout 120s pnpm run build; then
            echo "✁EReact Todo build passed"
          else
            echo "! React Todo build failed"
            exit 1
          fi

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      [
        plan-mode-integration,
        subagent-integration,
        benchmark-integration,
        example-projects-test,
      ]
    if: always()

    steps:
      - name: Quality gate check
        run: |
          # Check if all dependent jobs succeeded
          if [[ "${{ needs.plan-mode-integration.result }}" == "success" && \
                "${{ needs.subagent-integration.result }}" == "success" && \
                "${{ needs.benchmark-integration.result }}" == "success" && \
                "${{ needs.example-projects-test.result }}" == "success" ]]; then
            echo "✁EAll integration tests passed"
            echo "🎯 Codex is interview-ready!"
          else
            echo "❁ESome integration tests failed"
            echo "Plan Mode: ${{ needs.plan-mode-integration.result }}"
            echo "Sub-Agent: ${{ needs.subagent-integration.result }}"
            echo "Benchmark: ${{ needs.benchmark-integration.result }}"
            echo "Examples: ${{ needs.example-projects-test.result }}"
            exit 1
          fi
