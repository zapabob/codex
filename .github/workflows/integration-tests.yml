name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  plan-mode-integration:
    name: Plan Mode Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Codex
        run: cargo build --bin codex
        working-directory: codex-rs

      - name: Create test project
        run: |
          mkdir -p /tmp/integration-test
          cd /tmp/integration-test
          echo 'function add(a, b) { return a + b; }' > calc.js
          git init
          git add .
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit -m "Initial commit"

      - name: Test Plan Mode workflow
        run: |
          CODEX_BIN="$GITHUB_WORKSPACE/codex-rs/target/debug/codex"
          test -x "$CODEX_BIN"
          "$CODEX_BIN" --version

          FEATURES=$("$CODEX_BIN" features list 2>&1)
          echo "$FEATURES"
          echo "$FEATURES" | grep -Eq '^collaboration_modes[[:space:]]+removed[[:space:]]+true$'
          echo "$FEATURES" | grep -Eq '^multi_agent[[:space:]]+stable[[:space:]]+true$'

  subagent-integration:
    name: Sub-Agent Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Codex
        run: cargo build --bin codex
        working-directory: codex-rs

      - name: Create test project
        run: |
          mkdir -p /tmp/subagent-test
          cd /tmp/subagent-test
          # Create a more complex test file
          cat > server.js << 'EOF'
          const express = require('express');
          const app = express();

          app.get('/', (req, res) => {
            res.send('Hello World');
          });

          app.listen(3000);
          EOF

          npm init -y
          npm install express
          git init
          git add .
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit -m "Initial commit"

      - name: Test Sub-Agent orchestration
        run: |
          CODEX_BIN="$GITHUB_WORKSPACE/codex-rs/target/debug/codex"
          test -x "$CODEX_BIN"

          FEATURES=$(CODEX_HOME=$(mktemp -d) "$CODEX_BIN" \
            -c features.multi_agent=true features list 2>&1)
          echo "$FEATURES"
          echo "$FEATURES" | grep -Eq '^multi_agent[[:space:]]+stable[[:space:]]+true$'
          "$CODEX_BIN" exec --help | grep -q 'Run Codex non-interactively'

  benchmark-integration:
    name: Benchmark Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Codex
        run: cargo build --bin codex
        working-directory: codex-rs

      - name: Run benchmark tests
        run: |
          # Create benchmark test directory
          mkdir -p /tmp/benchmark-test
          cd /tmp/benchmark-test

          # Simple benchmark test
          echo "Testing benchmark functionality..."
          CODEX_BIN="$GITHUB_WORKSPACE/codex-rs/target/debug/codex"
          test -x "$CODEX_BIN"

          # Test 1: Basic performance measurement
          START_TIME=$(date +%s.%3N)
          timeout 30s "$CODEX_BIN" --version >/dev/null 2>&1
          END_TIME=$(date +%s.%3N)

          EXECUTION_TIME=$(echo "$END_TIME - $START_TIME" | bc 2>/dev/null || echo "0")
          echo "Basic execution time: ${EXECUTION_TIME}s"

          if (( $(echo "$EXECUTION_TIME < 5.0" | bc -l 2>/dev/null || echo "1") )); then
            echo "[OK] Performance within acceptable range"
          else
            echo "[WARN] Performance slower than expected: ${EXECUTION_TIME}s"
          fi

          # Test 2: Memory usage check
          echo "Testing memory usage..."
          MEM_KB=$({ /usr/bin/time -f '%M' "$CODEX_BIN" --help >/dev/null; } 2>&1 || echo "10240")
          MEM_MB=$(echo "scale=2; $MEM_KB / 1024" | bc 2>/dev/null || echo "10")
          echo "Memory usage: ${MEM_MB}MB"

          if (( $(echo "$MEM_MB < 100" | bc -l 2>/dev/null || echo "0") )); then
            echo "[OK] Memory usage within acceptable range"
          else
            echo "[WARN] Memory usage higher than expected: ${MEM_MB}MB"
          fi

  example-projects-test:
    name: Example Projects Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Test Node.js API Example
        run: |
          echo "Testing Node.js API example..."
          cd examples/node-api

          # Install dependencies
          npm install

          # Run tests
          if npm test; then
            echo "[OK] Node.js API tests passed"
          else
            echo "[WARN] Node.js API tests failed"
            exit 1
          fi

      - name: Test React Todo Example
        run: |
          echo "Testing React Todo example..."
          cd examples/react-todo

          # Install dependencies
          npm install

          # Build check
          if timeout 120s pnpm run build; then
            echo "[OK] React Todo build passed"
          else
            echo "[WARN] React Todo build failed"
            exit 1
          fi

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [
        plan-mode-integration,
        subagent-integration,
        benchmark-integration,
        example-projects-test,
      ]
    if: always()

    steps:
      - name: Quality gate check
        run: |
          # Check if all dependent jobs succeeded
          if [[ "${{ needs.plan-mode-integration.result }}" == "success" && \
                "${{ needs.subagent-integration.result }}" == "success" && \
                "${{ needs.benchmark-integration.result }}" == "success" && \
                "${{ needs.example-projects-test.result }}" == "success" ]]; then
            echo "[OK] All integration tests passed"
            echo "Ready!"
          else
            echo "[ERROR] Some integration tests failed"
            echo "Plan Mode: ${{ needs.plan-mode-integration.result }}"
            echo "Sub-Agent: ${{ needs.subagent-integration.result }}"
            echo "Benchmark: ${{ needs.benchmark-integration.result }}"
            echo "Examples: ${{ needs.example-projects-test.result }}"
            exit 1
          fi

