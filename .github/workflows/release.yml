name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: codex.exe
            asset_name: codex-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: codex
            asset_name: codex-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: codex
            asset_name: codex-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: codex
            asset_name: codex-linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: codex-rs/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: |
          cd codex-rs
          cargo build --release --target ${{ matrix.target }} -p codex-cli

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          strip codex-rs/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.asset_name }}
          path: codex-rs/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Create tgz package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TEMP_DIR="codex-${VERSION}-temp"
          mkdir -p "${TEMP_DIR}"
          
          # Copy essential files
          cp README.md LICENSE VERSION CHANGELOG.md package.json "${TEMP_DIR}/" 2>/dev/null || true
          cp config*.toml cliff.toml turbo.json "${TEMP_DIR}/" 2>/dev/null || true
          
          # Copy zapabob directory if it exists
          if [ -d "zapabob" ]; then
            cp -r zapabob "${TEMP_DIR}/"
          fi
          
          # Create tgz archive
          tar -czf "codex-${VERSION}.tgz" -C "${TEMP_DIR}" .
          rm -rf "${TEMP_DIR}"
          
          echo "Created codex-${VERSION}.tgz"
          ls -lh "codex-${VERSION}.tgz"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codex-windows-x64.exe/codex.exe
            codex-darwin-x64/codex
            codex-darwin-arm64/codex
            codex-linux-x64/codex
            codex-${{ steps.version.outputs.version }}.tgz
          body_path: RELEASE_NOTES_v1.0.0.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

