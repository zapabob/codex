[package]
name = "mcp-vrchat-server"
version = "2.14.1"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "mcp-vrchat-server"
path = "src/main.rs"

[dev-dependencies]
assert_fs = "1.0"
predicates = "3.0"
