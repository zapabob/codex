# Codex GUI Configuration
# Licensed under Apache 2.0

[github]
# GitHub Personal Access Token (set via environment variable)
# Generate at: https://github.com/settings/tokens
token = "${GITHUB_TOKEN}"

# Target repository for visualization
owner = "OpenAI"
repo = "codex"

# Webhook secret for real-time events (optional)
webhook_secret = "${WEBHOOK_SECRET}"

[websocket]
# WebSocket server URL for real-time Git events
# Format: ws://localhost:8080 or wss://your-server.com
server_url = "${WS_SERVER_URL}"
# Auto-reconnect interval in milliseconds
reconnect_interval = 5000
# Maximum reconnection attempts
max_reconnect_attempts = 10

[i18n]
# Default UI language (ja, en, zh, ko, etc.)
default_locale = "ja"
# Supported locales
supported_locales = ["ja", "en", "zh", "ko"]

[vr]
# Default VR mode: auto, vr, ar, desktop
default_mode = "auto"
# Enable haptic feedback
haptic_enabled = true
# Enable hand tracking (Quest 2/3, Apple Vision Pro)
hand_tracking = true
# Controller vibration intensity (0.0 - 1.0)
haptic_intensity = 0.7

[performance]
# Target FPS for VR
target_fps = 72
# Render scale (1.0 = native, 0.75 = 75% resolution)
render_scale = 1.0
# Enable Level of Detail (LOD) system
lod_enabled = true
# Maximum visible commit nodes
max_visible_commits = 100
# Particle system enabled
particles_enabled = true

[cyberpunk]
# Glow/bloom effect intensity
bloom_intensity = 2.5
# Chromatic aberration amount
chromatic_aberration = 0.002
# Noise overlay opacity
noise_opacity = 0.05
# Vignette darkness (0.0 - 1.0)
vignette_darkness = 0.6

[quest2]
# Quest 2/3 specific optimizations
target_fps = 72
refresh_rate = 72
fov = 90
render_scale = 0.8
# Enable ASW (Asynchronous Spacewarp)
asw_enabled = true

[steamvr]
# SteamVR specific optimizations
target_fps = 90
refresh_rate = 90
async_repro = true
motion_prediction = true

[virtual_desktop]
# Virtual Desktop streaming optimizations
target_fps = 45
render_scale = 0.6
bitrate = 50  # Mbps
codec = "h265"

[logging]
# Log level: debug, info, warn, error
level = "info"
# Enable console logging
console_enabled = true
# Enable file logging
file_enabled = false
