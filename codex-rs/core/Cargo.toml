[package]
edition = "2024"
name = "codex-core"
version = "0.1.0"

[lib]
doctest = false
name = "codex_core"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
git2 = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio = { version = "1.40", features = [
    "io-std",
    "macros",
    "rt-multi-thread",
] }

[dev-dependencies]
tempfile = "3.10"
