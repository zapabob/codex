[package]
edition = "2024"
name = "codex-core"
version = "0.1.0"

[lib]
doctest = false
name = "codex_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
askama = "0.12"
async-channel = "2.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
# 🔐 Security dependencies (Phase 1: TLS/mTLS)
x509-parser = { workspace = true }
# 🔐 Security dependencies (Phase 2: Signing/Encryption)
# aes-gcm = "0.10" # Temporarily disabled due to aws-lc-sys build issues
# Temporarily disabled complex local dependencies for minimal build
codex-app-server-protocol = { path = "../app-server-protocol" }
codex-apply-patch = { path = "../apply-patch" }
codex-async-utils = { path = "../async-utils" }
codex-api = { path = "../codex-api" }
codex-cuda-runtime = { path = "../cuda-runtime", optional = true }
codex-deep-research = { path = "../deep-research", optional = true }
codex-execpolicy = { path = "../execpolicy", optional = true }
codex-file-search = { path = "../file-search" }
codex-git = { path = "../utils/git" }
codex-keyring-store = { path = "../keyring-store" }
codex-otel = { path = "../otel", features = ["otel"] }
codex-protocol = { path = "../protocol" }
codex-rmcp-client = { path = "../rmcp-client", optional = true }
codex-utils-pty = { path = "../utils/pty" }
codex-utils-readiness = { path = "../utils/readiness" }
codex-utils-string = { path = "../utils/string" }
# codex-utils-tokenizer = { path = "../utils/tokenizer" }
dashmap = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
ed25519-dalek = { workspace = true }
env-flags = { workspace = true }
encoding_rs = { workspace = true }
eventsource-stream = { workspace = true }
fastrand = "2.0"
futures = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
hostname = "0.4"
http = { workspace = true }
indexmap = { workspace = true }
keyring = { workspace = true, features = ["crypto-rust"] }
libc = { workspace = true }
mcp-types = { path = "../mcp-types" }
ndarray = "0.15"
once_cell = { workspace = true }
os_info = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
strum_macros = { workspace = true }
sysinfo = "0.31"
tempfile = { workspace = true }
test-case = "3.3.1"
test-log = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = [
    "formatting",
    "parsing",
    "local-offset",
    "macros",
] }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "rt-multi-thread",
] }
tokio-util = { workspace = true, features = ["rt"] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
which = { workspace = true }
wildmatch = { workspace = true }
codex_windows_sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs" }
# codex-windows-ai = { path = "../windows-ai", optional = true } # Temporarily disabled

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }
keyring = { workspace = true, features = ["linux-native-async-persistent"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Using ring for all platforms instead of OpenSSL

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
# core_test_support = { path = "tests/common" } # Temporarily disabled
escargot = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
maplit = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }

[features]
default = []
rmcp = ["codex-rmcp-client"]
execpolicy = ["codex-execpolicy"]
deep-research = ["codex-deep-research"]

[package.metadata.cargo-shear]
ignored = []
