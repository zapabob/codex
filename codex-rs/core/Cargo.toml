[features]
deterministic_process_ids = []
test-support = []
agent_security = ["ed25519-dalek", "aes-gcm"]
windows-ai = ["codex-windows-ai"]
cuda = ["cudarc"]

# === Custom Features: Granular Feature Flags for Production ===
# Base feature - enables all custom modules
custom-features = []

# --- Git4D Visualization Stack ---
git4d-base = ["custom-features", "cuda", "git4d-vr"]  # Basic Git4D functionality with CUDA + VR
git4d-vr = []                                       # VR/AR support (now part of base)
git4d-superior = ["git4d-base", "git4d-vr"]         # Advanced AI/quantum features

# --- AI/Agent Communication Stack ---
a2a-comm = ["custom-features"]                      # Agent-to-agent communication
autonomous = ["custom-features", "a2a-comm"]        # Autonomous orchestration with self-healing

# --- Enterprise Features ---
enterprise = ["custom-features"]                    # Enterprise features (QC, planning, conflict resolution)
cowork = ["custom-features"]                        # Cowork integration
skill-mcp = ["custom-features"]                     # Skill/MCP integration
llmops = ["custom-features"]                        # LLMOps integration

# --- Convenience Presets ---
# Personal use: All features for individual developers
personal = [
    "custom-features",
    "git4d-superior",
    "a2a-comm",
    "autonomous",
    "llmops",
    "skill-mcp",
]

# On-premises: Enterprise deployment features
on-premises = [
    "custom-features",
    "git4d-base",
    "enterprise",
    "a2a-comm",
    "cowork",
    "llmops",
    "skill-mcp",
]

# Production-stable: Verified stable features only (no CUDA/VR required)
production = [
    "custom-features",
    "enterprise",
    "llmops",
]


[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-async-persistent"] }
landlock = { workspace = true }
seccompiler = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
keyring = { workspace = true, features = ["apple-native"] }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
codex-arg0 = { workspace = true }
codex-core = { path = ".", default-features = false, features = [
    "deterministic_process_ids",
] }
codex-otel = { workspace = true, features = [
    "disable-default-metrics-exporter",
] }
codex-utils-cargo-bin = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
maplit = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
