[package]
authors = ["zapabob"]
description = "Codex AI-Native OS Resident GUI Client"
edition = "2024"
name = "codex-tauri-gui"
version = "3.2.0"
license = { workspace = true }

[features]
cuda = []

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Workspace dependencies
codex-core = { path = "../../core" }

# External dependencies
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0"
tauri-plugin-shell = "2.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
which = "7"

# File system watcher
notify = "8"
notify-debouncer-full = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Time handling
chrono = "0.4"

# Windows specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# Exclude from main workspace
[workspace]

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/JakkuSakura/tokio-tungstenite", rev = "2ae536b0de793f3ddf31fc2f22d445bf1ef2023d" }

[patch."ssh://git@github.com/JakkuSakura/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/JakkuSakura/tungstenite-rs", rev = "f514de8644821113e5d18a027d6d28a5c8cc0a6e" }
