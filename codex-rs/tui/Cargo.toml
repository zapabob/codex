[package]
name = "codex-tui"
version = "2.3.0"
edition = "2024"

[[bin]]
name = "codex-tui"
path = "src/main.rs"

[dependencies]
# Core dependencies
codex-core = { path = "../core" }
color-eyre = "0.6"
tokio = { version = "1.0", features = ["full"] }

# TUI dependencies
crossterm = { workspace = true }
ratatui = { workspace = true }

# Workspace dependencies (inherited)
tokio-stream = { workspace = true }
futures-util = { workspace = true }
