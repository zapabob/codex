[workspace]
resolver = "2"
members = [
    "core",
    "deep-research",
    "mcp-types",
    "protocol",
    "cli",
    "tui",
]

[workspace.package]
version = "0.64.0-alpha.9"
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["OpenAI"]
repository = "https://github.com/openai/codex"

[workspace.lints.rust]
# Enhanced Security and Type Safety (Stricter than official repository)

# Memory Safety (Maximum security)
unsafe_code = "forbid"

# Type Safety (Maximum Security - Stricter than official)
missing_abi = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_unsafe = "forbid"
invalid_reference_casting = "forbid"
# cast_ref_to_mut = "forbid"  # Not available in this rustc version
# fn_to_numeric_cast_any = "forbid"  # Not available in this rustc version
# fn_to_numeric_cast_with_truncation = "forbid"  # Not available in this rustc version

# Code Quality (Maximum Security - Much stricter than official)
ambiguous_glob_reexports = "forbid"
const_item_mutation = "forbid"
dead_code = "forbid"
deprecated = "warn"  # Allow derive macros
deprecated_in_future = "forbid"
hidden_glob_reexports = "forbid"
improper_ctypes = "forbid"
improper_ctypes_definitions = "forbid"
invalid_value = "forbid"
late_bound_lifetime_arguments = "forbid"
non_ascii_idents = "forbid"
non_camel_case_types = "warn"  # Allow derive macros
non_snake_case = "forbid"
non_upper_case_globals = "warn"  # Allow derive macros
no_mangle_generic_items = "forbid"
overlapping_range_endpoints = "forbid"
path_statements = "forbid"
# private_in_public = "forbid"  # Removed lint
private_interfaces = "forbid"
special_module_name = "forbid"
stable_features = "forbid"
trivial_bounds = "forbid"
type_alias_bounds = "forbid"
tyvar_behind_raw_pointer = "forbid"
uncommon_codepoints = "forbid"
unconditional_recursion = "forbid"
unknown_lints = "warn"
unnameable_test_items = "forbid"
unreachable_code = "forbid"

# Resource Management (Enhanced)
unused_allocation = "warn"
unused_assignments = "warn"
unused_attributes = "warn"
unused_braces = "warn"
unused_comparisons = "warn"
unused_doc_comments = "warn"
unused_extern_crates = "warn"
unused_features = "warn"
unused_imports = "warn"
unused_labels = "warn"
unused_lifetimes = "warn"
unused_macros = "warn"
unused_must_use = "warn"
unused_mut = "warn"
unused_parens = "warn"
unused_qualifications = "warn"
unused_variables = "warn"

# Runtime Safety (Maximum Security - Stricter than official)
panic = "forbid"
# panic_in_result_fn = "forbid"  # Not available in this rustc version
# unreachable removed - using clippy::unreachable
unreachable_pub = "forbid"

# Documentation (Maintained)
missing_docs = "warn"

# Comprehensive Warning Coverage
warnings = "warn"
renamed_and_removed_lints = "warn"

[workspace.lints.clippy]
# Enhanced Clippy Lints (More comprehensive than official)

# Security and Memory Safety (Maximum Security - Stricter than official)
debug_assert_with_mut_call = "forbid"
exit = "forbid"
float_cmp_const = "forbid"
imprecise_flops = "forbid"
lossy_float_literal = "forbid"
mem_forget = "forbid"
mutex_atomic = "forbid"
mutex_integer = "forbid"
panic = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
unimplemented = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
infinite_loop = "forbid"
string_slice = "forbid"
empty_loop = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
incorrect_clone_impl_on_copy_type = "forbid"
manual_ok_or = "forbid"
option_env_unwrap = "forbid"
result_map_unit_fn = "forbid"
verbose_file_reads = "forbid"
# unreachable removed - clippy default
unreachable = "forbid"

# Type Safety (Maximum Security - Stricter than official)
as_conversions = "forbid"
borrow_as_ptr = "forbid"
cast_lossless = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_precision_loss = "forbid"
cast_ptr_alignment = "forbid"
cast_sign_loss = "forbid"
char_lit_as_u8 = "forbid"
fn_to_numeric_cast = "forbid"
fn_to_numeric_cast_with_truncation = "forbid"
ptr_as_ptr = "forbid"
ptr_cast_constness = "forbid"
transmute_ptr_to_ref = "forbid"
# fn_to_numeric_cast_with_truncation = "warn"  # Removed duplicate
# ptr_as_ptr = "warn"  # Removed duplicate
# ptr_cast_constness = "warn"  # Removed duplicate
string_lit_as_bytes = "warn"
unnecessary_cast = "warn"

# Performance and Correctness (Maximum Security - Stricter than official)
inefficient_to_string = "forbid"
needless_collect = "forbid"
redundant_clone = "forbid"
redundant_slicing = "forbid"
string_add_assign = "forbid"
string_add = "forbid"
vec_init_then_push = "forbid"
needless_to_owned = "forbid"
unnecessary_fold = "forbid"
redundant_allocation = "forbid"

# Code Quality (Maximum Security - Much stricter than official)
cognitive_complexity = "forbid"
too_many_arguments = "forbid"
too_many_lines = "forbid"
type_complexity = "forbid"
large_stack_arrays = "forbid"
large_stack_frames = "forbid"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
ansi-to-tui = "7.0"
arboard = { version = "3", features = ["wayland-data-control"] }
assert_cmd = "2.0"
assert_matches = "1.5"
async-channel = "2.3"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
cmake = { version = "0.1.60", features = ["cmake28"] }
color-eyre = "0.6"
crossterm = { git = "https://github.com/nornagon/crossterm", branch = "nornagon/color-query" }
derive_more = "2"
diffy = "0.4"
dirs = "5.0"
dotenvy = "0.15"
dunce = "1.0"
ed25519-dalek = "2.0"
encoding_rs = "0.8"
env-flags = "0.1"
escargot = "0.5"
eventsource-stream = "0.2"
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1.1"
ignore = "0.4"
image = { version = "0.25", features = ["jpeg", "png"] }
indexmap = "2.5"
insta = "1.43"
itertools = "0.12"
keyring = { version = "3.0", features = ["apple-native", "crypto-rust", "linux-native-async-persistent", "windows-native"] }
lazy_static = "1.5"
libc = "0.2"
lru = "0.12"
maplit = "1.0"
mcp-types = { path = "mcp-types" }
notify = "8.2"
nucleo-matcher = "0.3"
once_cell = "1.19"
opentelemetry-appender-tracing = "0.30"
os_info = "3.8"
paste = "1.0"
pathdiff = "0.2"
predicates = "3.1"
pretty_assertions = "1.4"
pulldown-cmark = "0.10"
rand = "0.8"
ratatui = { git = "https://github.com/nornagon/ratatui", branch = "nornagon-v0.29.0-patch" }
ratatui-macros = "0.6.0"
regex-lite = "0.1"
regex = "1.10"
serial_test = "3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
rustls = "0.23"
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
x509-parser = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1.3"
similar = "2.6"
strum_macros = "0.26"
tempfile = "3.12"
test-log = "0.2"
tiny_http = "0.12"
thiserror = "1.0"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tokio-test = "0.4"
tracing = { version = "0.1", features = ["log"] }
tracing-appender = "0.2"
tracing-subscriber = "0.3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.21"
tree-sitter-highlight = "0.25"
supports-color = "3.0"
textwrap = "0.16"
unicode-segmentation = "1.12"
unicode-width = "0.2.1"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["serde", "v4", "v5"] }
vt100 = "0.16.2"
walkdir = "2.5"
webbrowser = "0.8"
which = "6.0"
wildmatch = "2.3"
wiremock = "0.6"
dashmap = "6.0"
aes-gcm = "0.10"
landlock = "0.3"
mime_guess = "2.0"
openssl-sys = { version = "0.9", features = ["vendored"] }
seccompiler = "0.4"
serde_with = { version = "3.8", features = ["macros", "base64"] }
schemars = "0.8"
strum = "0.26"
sys-locale = "0.3"
ts-rs = { version = "10.0", features = ["serde-json-impl", "no-serde-warnings"] }
futures-util = "0.3"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }

# Local crates (workspace dependencies)
codex-core = { path = "core" }
codex-ansi-escape = { path = "ansi-escape" }
codex-app-server-protocol = { path = "app-server-protocol" }
codex-apply-patch = { path = "apply-patch" }
codex-arg0 = { path = "arg0" }
codex-async-utils = { path = "async-utils" }
codex-backend-client = { path = "backend-client" }
codex-common = { path = "common" }
codex-deep-research = { path = "deep-research" }
codex-feedback = { path = "feedback" }
codex-file-search = { path = "file-search" }
codex-git = { path = "utils/git" }
codex-keyring-store = { path = "keyring-store" }
codex-linux-sandbox = { path = "linux-sandbox" }
codex-lmstudio = { path = "lmstudio" }
codex-login = { path = "login" }
codex-mcp-types = { path = "mcp-types" }
codex-ollama = { path = "ollama" }
codex-protocol = { path = "protocol" }
codex-rmcp-client = { path = "rmcp-client" }
codex-utils-pty = { path = "utils-pty" }
codex-utils-readiness = { path = "utils-readiness" }
codex-utils-string = { path = "utils-string" }
codex-utils-tokenizer = { path = "utils-tokenizer" }
codex-windows-sandbox = { path = "windows-sandbox-rs" }
core_test_support = { path = "core/tests/common" }
codex-utils-image = { path = "utils/image" }

[patch.crates-io]
# Patch ratatui to use the forked version that's compatible with unicode-width 0.2.1
# This ensures ratatui-macros uses the forked ratatui instead of the crates.io version
ratatui = { git = "https://github.com/nornagon/ratatui", branch = "nornagon-v0.29.0-patch" }
# Use rustls instead of aws-lc-sys for better Windows compatibility

