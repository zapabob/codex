[workspace]
members = ["core"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.47.0-alpha.1"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
panic = "warn"
missing_docs = "warn"

[workspace.dependencies]
clap = "4.5"
clap_complete = "4.5"
anyhow = "1.0"
async-channel = "2.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
dirs = "5.0"
dunce = "1.0"
futures = "0.3"
hex = "0.4"
http = "1.1"
indexmap = "2.5"
libc = "0.2"
once_cell = "1.20"
os_info = "3.8"
rand = "0.8"
regex = "1.11"
regex-lite = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
shlex = "1.3"
statrs = "0.16"
tempfile = "3.12"
test-log = "0.2"
thiserror = "1.0"
time = "0.3"
tokio = "1.40"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tree-sitter = "0.23"
tree-sitter-bash = "0.23"
url = "2.5"
uuid = "1.10"
which = "6.0"
wildmatch = "2.3"

[workspace.dependencies.dev]
assert_cmd = "2.0"
assert_matches = "1.5"
escargot = "0.5"
image = "0.25"
maplit = "1.0"
predicates = "3.1"
pretty_assertions = "1.4"
serial_test = "3.1"
tokio-test = "0.4"
tracing-test = "0.2"
walkdir = "2.5"
wiremock = "0.6"
clap = "4.5"
clap_complete = "4.5"
ctor = "0.2"
notify = "6.1"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"



