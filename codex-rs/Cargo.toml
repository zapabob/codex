[workspace.package]
edition = "2021"
version = "2.3.0"
rust-version = "1.80"

[workspace]
members = ["tui"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
unreachable = "warn"
panic = "warn"
missing_docs = "warn"

[workspace.dependencies]
aes-gcm = "0.10"
askama = "0.12"
async-stream = "0.3"
clap = "4.5"
codex-core = { path = "core" }
clap_complete = "4.5"
codex-ansi-escape = { path = "ansi-escape" }
codex-app-server = { path = "app-server" }
anyhow = "1.0"
async-channel = "2.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
crossterm = "0.27"
derive_more = "0.99"
diffy = "0.3"
dirs = "5.0"
dunce = "1.0"
futures = "0.3"
git2 = "0.18"
hex = "0.4"
http = "1.1"
image = "0.25"
indexmap = "2.5"
itertools = "0.12"
lazy_static = "1.5"
libc = "0.2"
mcp-types = "0.1"
opentelemetry-appender-tracing = "0.4"
pathdiff = "0.2"
pulldown-cmark = "0.10"
rand = "0.8"
ratatui = "0.26"
regex = "1.10"
regex-lite = "0.1"
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
shlex = "1.3"
statrs = "0.16"
strum = "0.26"
strum_macros = "0.26"
supports-color = "3.0"
tempfile = "3.12"
test-log = "0.2"
thiserror = "1.0"
time = "0.3"
tokio = "1.40"
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
tree-sitter = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-highlight = "0.1"
unicode-segmentation = "1.11"
unicode-width = "0.1"
url = "2.5"
uuid = "1.10"
which = "6.0"
wildmatch = "2.3"
codex-windows-sandbox = { path = "windows-sandbox" }
arboard = "3.4"
