[package]
edition.workspace = true
name = "codex-deep-research"
version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# Remove rmcp-client dependency - use direct GeminiCLI integration
mcp-types = { path = "../mcp-types" }
regex = "1.10"
reqwest = { workspace = true, default-features = false, features = ["json", "stream", "rustls-tls"] }
# Security Enhancement: Keep scraper at secure version
scraper = "0.24"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full", "process"] }
tracing = { workspace = true }
urlencoding = "2.1"
# Add tokio process for GeminiCLI execution
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
pretty_assertions = "1.4"
tokio-test = "0.4"

[features]
default = []

[[bench]]
harness = false
name = "performance"
