[package]
name = "codex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codex"
path = "src/main.rs"

[lib]
name = "codex_cli"
path = "src/lib.rs"

[lints]
workspace = true

[features]
cuda = []
windows-ai = []
# Custom features: preserve custom functionality when merging with upstream
custom-features = [
    "codex-core/custom-features",
    "codex-core/a2a-comm",
    "codex-core/autonomous",
    "codex-core/llmops",
    "codex-core/skill-mcp",
]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
codex-app-server = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-chatgpt = { workspace = true }
codex-cloud-tasks = { path = "../cloud-tasks" }
codex-common = { workspace = true, features = ["cli"] }
codex-core = { workspace = true }
codex-deep-research = { path = "../deep-research" }
codex-exec = { workspace = true }
codex-web-search = { path = "../web-search" }
codex-execpolicy = { workspace = true }
codex-login = { workspace = true }
codex-mcp-server = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
codex-protocol-ts = { path = "../protocol-ts" }
codex-responses-api-proxy = { workspace = true }
codex-rmcp-client = { workspace = true }
codex-supervisor = { path = "../supervisor" }
codex-stdio-to-uds = { workspace = true }
codex-tui = { workspace = true }
codex-utils-absolute-path = { workspace = true }
libc = { workspace = true }
git2 = { version = "0.19", default-features = false }
futures = { workspace = true }
dirs = "6"
mcp-types = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
slug = "0.1.4"
supports-color = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
walkdir = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codex_windows_sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs" }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
