[workspace]

[package]
name = "codex-cli"
version = "2.3.0"
edition = "2024"

[[bin]]
name = "codex"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
# Temporary: direct dependencies to avoid workspace issues
async-channel = "2.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.7"
dirs = "5.0"
dunce = "1.0"
futures = "0.3"
hex = "0.4"
indexmap = "2.5"
once_cell = "1.19"
rand = "0.8"
regex-lite = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1.3"
tempfile = "3.12"
thiserror = "1.0"
time = "0.3"
tokio-util = "0.7"
toml = "0.8"
tracing-appender = "0.2"
url = "2.5"
uuid = { version = "1.10", features = ["serde", "v4", "v5"] }
which = "6.0"
wildmatch = "2.3"
# MCP and Deep Research dependencies
mcp-types = { path = "../mcp-types" }
codex-deep-research = { path = "../deep-research" }

