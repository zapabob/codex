# MCP Servers Configuration for Codex
# Enhanced MCP server configurations with Serena, ArXiv, GitHub integration

servers:
  # Serena - Advanced code intelligence and analysis
  serena:
    command: "npx"
    args: ["@modelcontextprotocol/server-serena", "--port", "3001"]
    env:
      MCP_SERENA_MODEL: "gpt-4o"
      MCP_SERENA_MAX_TOKENS: "100000"
    capabilities:
      - "code-analysis"
      - "semantic-search"
      - "refactoring-suggestions"
      - "dependency-analysis"

  # ArXiv - Academic paper search and analysis
  arxiv:
    command: "python"
    args: ["-m", "arxiv_mcp_server"]
    env:
      ARXIV_MAX_RESULTS: "50"
      ARXIV_SORT_BY: "relevance"
    capabilities:
      - "academic-search"
      - "paper-analysis"
      - "citation-extraction"
      - "research-synthesis"

  # GitHub - Repository and issue management
  github:
    command: "node"
    args: ["dist/github-mcp-server.js"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_API_BASE: "https://api.github.com"
    capabilities:
      - "repo-search"
      - "issue-management"
      - "pr-analysis"
      - "code-review"
      - "contributor-insights"

  # Enhanced filesystem with git integration
  git-enhanced:
    command: "git-enhanced-mcp"
    args: ["--enable-git-log", "--enable-blame"]
    capabilities:
      - "git-history"
      - "code-blame"
      - "commit-analysis"
      - "branch-comparison"

  # Documentation analyzer
  docs-analyzer:
    command: "docs-analyzer-mcp"
    args: ["--support-formats", "md,pdf,html,docx"]
    capabilities:
      - "document-parsing"
      - "content-extraction"
      - "structure-analysis"
      - "search-indexing"

  # YouTube - Video search and analysis
  youtube:
    command: "youtube-mcp-server"
    args: ["--api-key", "${YOUTUBE_API_KEY}"]
    env:
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY}"
      YOUTUBE_MAX_RESULTS: "25"
      YOUTUBE_SEARCH_ORDER: "relevance"
    capabilities:
      - "video-search"
      - "channel-analysis"
      - "transcript-extraction"
      - "video-metadata"
      - "content-analysis"

  # Playwright - Browser automation and scraping
  playwright:
    command: "playwright-mcp-server"
    args: ["--browser", "chromium", "--headless", "true"]
    env:
      PLAYWRIGHT_BROWSER: "chromium"
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_TIMEOUT: "30000"
      PLAYWRIGHT_VIEWPORT: "1280x720"
    capabilities:
      - "web-scraping"
      - "browser-automation"
      - "screenshot-capture"
      - "dom-analysis"
      - "form-interaction"
      - "javascript-execution"

  # Filesystem - Enhanced file system operations
  filesystem:
    command: "filesystem-mcp-server"
    args: ["--root-dir", ".", "--enable-git", "true", "--enable-metadata", "true"]
    env:
      FILESYSTEM_ROOT: "."
      FILESYSTEM_ENABLE_GIT: "true"
      FILESYSTEM_ENABLE_METADATA: "true"
      FILESYSTEM_MAX_FILE_SIZE: "10485760"
    capabilities:
      - "file-operations"
      - "directory-traversal"
      - "git-integration"
      - "metadata-extraction"
      - "content-analysis"
      - "batch-operations"
      - "search-indexing"

  # Gemini CLI MCP - Gemini AI integration
  gemini-cli:
    command: "codex-gemini-mcp"
    args: []
    env:
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "gemini-3.0-pro-latest"
      GEMINI_MAX_TOKENS: "8192"
      GEMINI_TEMPERATURE: "0.7"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET}"
    capabilities:
      - "ai-assistance"
      - "code-generation"
      - "code-review"
      - "documentation"
      - "research-assistance"
      - "problem-solving"
      - "creative-writing"
      - "data-analysis"

# Development mode specific servers
development:
  parallel-dev:
    - serena
    - github
    - git-enhanced
    - filesystem
    - playwright

  centralized-dev:
    - serena
    - arxiv
    - docs-analyzer
    - youtube
    - gemini-cli

# Agent-specific server assignments
agent_servers:
  architect:
    - serena
    - docs-analyzer
    - git-enhanced
    - filesystem
    - gemini-cli

  researcher:
    - arxiv
    - github
    - docs-analyzer
    - youtube
    - playwright

  code-reviewer:
    - serena
    - github
    - git-enhanced
    - filesystem
    - gemini-cli

  qc-optimizer:
    - serena
    - github
    - docs-analyzer
    - filesystem
    - playwright

# Auto-start servers for different development modes
auto_start:
  centralized: ["serena", "arxiv"]
  parallel: ["serena", "github", "git-enhanced"]
